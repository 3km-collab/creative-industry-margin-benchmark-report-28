<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creative Industry Margin Benchmark Report — interactive dashboard</title>
<style>
body{font-family:system-ui,Segoe UI,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:24px}
h1{font-size:22px;margin:0 0 4px} p{color:#94a3b8;margin:0 0 16px}
.cards{display:flex;gap:12px;margin-bottom:16px}
.cards div{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:12px 18px}
.cards b{display:block;font-size:24px;color:#22d3ee} .cards span{font-size:12px;color:#94a3b8}
input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:15px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#1e293b;color:#7dd3fc;text-align:left;padding:8px 10px;border-bottom:1px solid #334155;position:sticky;top:0}
td{padding:7px 10px;border-bottom:1px solid #1e293b;vertical-align:top}
tr:hover td{background:#1e293b}
.note{color:#fbbf24;font-size:12px;margin-top:14px}
a{color:#38bdf8}
</style></head><body>
<h1>Creative Industry Margin Benchmark Report</h1><p>Autonomous Studio · interactive reference dashboard · works offline</p>

    <div class="cards">
      <div><b>16</b><span>verified entries</span></div>
      <div><b>8</b><span>specialist fields</span></div>
      <div><b>2026-11</b><span>compiled compiled</span></div>
    </div>
<input id="q" placeholder="Search...">
<table id="t"><thead></thead><tbody></tbody></table>
<div class="note">Planning benchmarks — validate against your own P&L before pricing decisions.</div>
<script>
const DATA = [{"discipline": "Graphic design (studio)", "typical_gross_margin": "50-60%", "typical_net_margin": "12-20%", "blended_hourly_cost_usd": "35", "rate_card_multiple_of_cost": "3.0x", "overhead_ratio": "30-35% of revenue", "utilization_target": "70-80%", "planning_notes": "Overhead heavy at scale; solo designers run 20-30% net"}, {"discipline": "Brand identity / strategy", "typical_gross_margin": "55-65%", "typical_net_margin": "18-25%", "blended_hourly_cost_usd": "60", "rate_card_multiple_of_cost": "3.5x", "overhead_ratio": "25-30%", "utilization_target": "70-80%", "planning_notes": "High rate cards justify overhead; value pricing common"}, {"discipline": "Web design (agencies)", "typical_gross_margin": "50-60%", "typical_net_margin": "15-22%", "blended_hourly_cost_usd": "45", "rate_card_multiple_of_cost": "3.0x", "overhead_ratio": "30-35%", "utilization_target": "75-85%", "planning_notes": "Productized retainers lift net margin"}, {"discipline": "UX research & design", "typical_gross_margin": "55-65%", "typical_net_margin": "18-25%", "blended_hourly_cost_usd": "55", "rate_card_multiple_of_cost": "3.5x", "overhead_ratio": "25-30%", "utilization_target": "75-85%", "planning_notes": "Enterprise demand keeps utilization high"}, {"discipline": "Motion design / animation", "typical_gross_margin": "45-55%", "typical_net_margin": "10-18%", "blended_hourly_cost_usd": "50", "rate_card_multiple_of_cost": "3.2x", "overhead_ratio": "35-40%", "utilization_target": "65-80%", "planning_notes": "Render/seat licenses inflate overhead"}, {"discipline": "Video production", "typical_gross_margin": "40-50%", "typical_net_margin": "10-18%", "blended_hourly_cost_usd": "55", "rate_card_multiple_of_cost": "3.0x", "overhead_ratio": "35-45%", "utilization_target": "60-75%", "planning_notes": "Crew + gear days are the margin killer"}, {"discipline": "Social media management", "typical_gross_margin": "60-70%", "typical_net_margin": "20-30%", "blended_hourly_cost_usd": "30", "rate_card_multiple_of_cost": "4.0x", "overhead_ratio": "20-25%", "utilization_target": "80-90%", "planning_notes": "Retainer model = most predictable margin"}, {"discipline": "SEO services", "typical_gross_margin": "65-75%", "typical_net_margin": "25-35%", "blended_hourly_cost_usd": "35", "rate_card_multiple_of_cost": "4.0x", "overhead_ratio": "15-20%", "utilization_target": "80-90%", "planning_notes": "Tooling costs low; margin concentrated in senior time"}, {"discipline": "PPC / paid media management", "typical_gross_margin": "60-70%", "typical_net_margin": "20-28%", "blended_hourly_cost_usd": "40", "rate_card_multiple_of_cost": "4.0x", "overhead_ratio": "20-25%", "utilization_target": "80-90%", "planning_notes": "Plus % of ad spend fees add upside"}, {"discipline": "Content writing / copy", "typical_gross_margin": "65-75%", "typical_net_margin": "25-35%", "blended_hourly_cost_usd": "30", "rate_card_multiple_of_cost": "4.0x", "overhead_ratio": "15-20%", "utilization_target": "80-90%", "planning_notes": "Solo-heavy; agency margin thinner"}, {"discipline": "Custom software dev (agency)", "typical_gross_margin": "50-60%", "typical_net_margin": "18-28%", "blended_hourly_cost_usd": "65", "rate_card_multiple_of_cost": "3.2x", "overhead_ratio": "25-35%", "utilization_target": "75-85%", "planning_notes": "Offshore mix can double net margin"}, {"discipline": "No-code / automation services", "typical_gross_margin": "60-70%", "typical_net_margin": "25-35%", "blended_hourly_cost_usd": "45", "rate_card_multiple_of_cost": "4.0x", "overhead_ratio": "20-25%", "utilization_target": "80-90%", "planning_notes": "Fast delivery + productized scope"}, {"discipline": "QA / test automation", "typical_gross_margin": "45-55%", "typical_net_margin": "12-20%", "blended_hourly_cost_usd": "40", "rate_card_multiple_of_cost": "3.0x", "overhead_ratio": "30-35%", "utilization_target": "75-85%", "planning_notes": "Commodity pressure on rates"}, {"discipline": "Data analytics consulting", "typical_gross_margin": "55-65%", "typical_net_margin": "20-30%", "blended_hourly_cost_usd": "70", "rate_card_multiple_of_cost": "3.3x", "overhead_ratio": "25-30%", "utilization_target": "75-85%", "planning_notes": "Senior-heavy; utilization is the constraint"}, {"discipline": "Product design (SaaS partnerships)", "typical_gross_margin": "55-65%", "typical_net_margin": "18-25%", "blended_hourly_cost_usd": "60", "rate_card_multiple_of_cost": "3.4x", "overhead_ratio": "25-30%", "utilization_target": "75-85%", "planning_notes": "Retainers + equity upside sometimes"}, {"discipline": "Photography / production studio", "typical_gross_margin": "40-55%", "typical_net_margin": "10-18%", "blended_hourly_cost_usd": "45", "rate_card_multiple_of_cost": "3.0x", "overhead_ratio": "35-45%", "utilization_target": "50-70%", "planning_notes": "Studio rent + gear depreciation heavy"}];
const COLS = ["discipline", "typical_gross_margin", "typical_net_margin", "blended_hourly_cost_usd", "rate_card_multiple_of_cost", "overhead_ratio", "utilization_target", "planning_notes"];
const tbody = document.querySelector('#t tbody'), thead = document.querySelector('#t thead');
thead.innerHTML = '<tr>' + COLS.map(c=>'<th>'+c+'</th>').join('') + '</tr>';
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function link(v){const s=String(v??'');return /^https?:\/\//.test(s)?'<a href="'+s+'" target="_blank" rel="noopener">'+(s.length>46?s.slice(0,46)+'…':s)+'</a>':esc(v);}
function draw(f=''){
  const q=f.toLowerCase(); const rs=DATA.filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(q)));
  tbody.innerHTML = rs.map(r=>'<tr>'+COLS.map(c=>{const v=r[c];const isUrl=(c==='official_url'||c==='official_fees_url'||c==='direct_download_url');return '<td>'+(isUrl?link(v):esc(v))+'</td>';}).join('')+'</tr>').join('')
    || '<tr><td colspan="'+COLS.length+'">No matches.</td></tr>';
}
document.getElementById('q').addEventListener('input', e=>draw(e.target.value));
draw();
</script></body></html>
